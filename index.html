<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>UserBotHost</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=24">
<link rel="stylesheet" href="no-flicker.css?v=24">
</head>
<body>
<div id="app" class="app">
  <div class="boot-screen" id="boot-screen">
    <div class="boot-prompt">
      <span class="boot-line">$ systemctl status userbot-control</span>
      <span class="boot-line boot-cursor">_</span>
    </div>
  </div>
</div>

<div id="dialogContainer" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0a0f; z-index:1000; overflow-y:auto;">
    <div id="dialogContent"></div>
</div>

<div id="chatContainer" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0a0f; z-index:1001; overflow-y:auto; flex-direction:column;">
    <div id="chatContent"></div>
</div>

<!-- Базовый сетевой слой, роутер и контроллер обновлений -->
<script src="api.js?v=24"></script>
<script src="app.js?v=24"></script>
<script src="refresh-controller.js?v=24"></script>

<!-- Главный скрипт дизайна, настроек и выбора языка -->
<script src="redesign.js?v=2401"></script>

<script src="menu-cleanup.js?v=24"></script>

<!-- Страховочный таймер: гарантирует снятие заставки при любых задержках сети -->
<script>
  setTimeout(function() {
    var boot = document.getElementById("boot-screen");
    if (boot) {
      boot.remove();
      if (typeof window.render === "function") {
        window.render();
      }
    }
  }, 1200);
</script>
</body>
</html>
